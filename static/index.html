<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Best Deal Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf0f2;--panel:#fff;--ink:#17212b;--muted:#5b6875;--line:#d3dae0;--accent:#0b6e4f;--on:#fff;--tag:#f2c14e;--tag-ink:#3d2e00;--bad:#b3261e;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--panel:#18212a;--ink:#e8edf1;--muted:#98a5b1;--line:#2b3742;--accent:#4fc79b;--on:#08241a;--tag:#e0b13c;--tag-ink:#2b2000;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{max-width:1200px;margin:auto;padding:24px clamp(16px,4vw,40px) 8px}
h1{margin:0;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--muted)}
main{max-width:1200px;margin:auto;padding:12px clamp(16px,4vw,40px) 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h2{margin:0 0 12px;font-size:1.1rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#log{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:52vh;overflow:auto;padding-bottom:4px}
.msg{padding:10px 14px;border-radius:var(--r);max-width:92%;overflow-wrap:anywhere}
.msg p{margin:0 0 6px}.msg p:last-child,.msg ul{margin-bottom:0}.msg ul{margin:0 0 6px;padding-left:20px}
.user{align-self:flex-end;background:var(--ink);color:var(--bg);white-space:pre-wrap}
.bot{background:var(--bg)}.err{background:none;border:1px solid var(--bad);color:var(--bad)}
.pending{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 12px;font-size:.88rem}
.chip button,.links li button{background:none;border:0;color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 8px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700}
.links{list-style:none;margin:8px 0 0;padding:0;font-size:.88rem;color:var(--muted)}
.links li{display:flex;justify-content:space-between;gap:8px;align-items:center}
.links li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea,select{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px}
textarea{resize:vertical;margin:8px 0}
.row{display:flex;gap:8px;align-items:flex-end}.row textarea{margin:0}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--on);border:0;border-radius:var(--r);padding:10px 18px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:wait}
form.send{margin-top:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.head h2{margin:0}.head select{width:auto}
.empty{color:var(--muted);margin:0}
.tag{position:relative;background:var(--tag);color:var(--tag-ink);border-radius:6px 20px 20px 6px;padding:18px 18px 18px 48px;margin-bottom:6px}
.tag::before{content:"";position:absolute;left:18px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.tag h3{margin:0;font-size:1.15rem}.tag .big{font-size:2.6rem;font-weight:700;line-height:1.1;letter-spacing:-.03em;margin:6px 0 2px}
.tag .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.92rem}
.tag a{display:inline-block;margin-top:12px;background:var(--tag-ink);color:var(--tag);padding:8px 16px;border-radius:99px;text-decoration:none;font-weight:700}
.offer{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:12px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.offer:hover b{text-decoration:underline}
.offer .tot{font-weight:700;font-size:1.15rem;text-align:right}
.sub{color:var(--muted);font-size:.9rem;display:flex;gap:12px}.sub.r{justify-content:flex-end}
.best{color:var(--accent);font-weight:700}
@media(prefers-reduced-motion:no-preference){.tag{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
</style>
</head>
<body>
<header>
  <h1>Best Deal Finder</h1>
  <p>Describe what you want, or paste product links. We compare the offers and rank them.</p>
</header>
<main>
  <section aria-label="Chat">
    <h2>Chat</h2>
    <div id="log" role="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <details id="tray">
      <summary>Add product links<span id="linkcount"></span></summary>
      <textarea id="links" rows="3" placeholder="Paste URLs, one per line" aria-label="Product links"></textarea>
      <button class="btn ghost" id="addLinks" type="button">Add links</button>
      <ul class="links" id="linklist"></ul>
    </details>
    <form class="send" id="form">
      <div class="row">
        <textarea id="msg" rows="2" placeholder="Best deal on a wireless mouse under $100" aria-label="Your message"></textarea>
        <button class="btn" id="go" type="submit">Compare</button>
      </div>
    </form>
  </section>

  <section aria-label="Offers">
    <div class="head">
      <h2 id="offerTitle">Offers</h2>
      <select id="sort" aria-label="Sort offers" hidden>
        <option value="score">Best score</option>
        <option value="total">Lowest total</option>
        <option value="price">Lowest price</option>
        <option value="rating">Highest rating</option>
      </select>
    </div>
    <div id="results"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const st = {sid: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), links: [], filters: {}, offers: [], searched: false, busy: false};
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Minimal, safe markdown for model replies: bold, bullets, paragraphs
function md(t) {
  const out = []; let ul = false;
  for (const raw of esc(t).split('\n')) {
    const m = raw.match(/^\s*[*-]\s+(.*)/);
    if (m) { if (!ul) { out.push('<ul>'); ul = true; } out.push('<li>' + m[1] + '</li>'); }
    else { if (ul) { out.push('</ul>'); ul = false; } if (raw.trim()) out.push('<p>' + raw + '</p>'); }
  }
  if (ul) out.push('</ul>');
  return out.join('').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function addMsg(kind, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  if (kind === 'bot') d.innerHTML = md(text); else d.textContent = text;
  $('#log').appendChild(d); d.scrollIntoView({block: 'end'});
  return d;
}

const clean = u => { try { const x = new URL(u); [...x.searchParams.keys()].filter(k => k.startsWith('utm_')).forEach(k => x.searchParams.delete(k)); return x.toString(); } catch { return u; } };

function money(o, n) { return o.currency + Number(n).toFixed(2); }
const sorters = {score: (a, b) => b.score - a.score, total: (a, b) => a.total - b.total, price: (a, b) => a.price - b.price, rating: (a, b) => b.rating - a.rating};

function render() {
  $('#chips').innerHTML = Object.entries(st.filters).map(([k, v]) =>
    `<span class="chip">${esc(k.replace(/_/g, ' '))}: ${esc(v)}<button type="button" data-k="${esc(k)}" aria-label="Remove ${esc(k)} filter">×</button></span>`).join('');
  $('#linklist').innerHTML = st.links.map((l, i) =>
    `<li><span>${esc(l)}</span><button type="button" data-i="${i}" aria-label="Remove link">×</button></li>`).join('');
  $('#linkcount').textContent = st.links.length ? ` (${st.links.length})` : '';

  const box = $('#results'), sel = $('#sort');
  sel.hidden = !st.offers.length;
  $('#offerTitle').textContent = st.offers.length ? `Offers found (${st.offers.length})` : 'Offers';
  if (!st.offers.length) {
    box.innerHTML = `<p class="empty">${st.searched ? 'No offers match your filters. Remove a filter or raise your price limit.' : 'Offers appear here. Ask about a product or add links to compare.'}</p>`;
    return;
  }
  const list = [...st.offers].sort(sorters[sel.value]);
  const href = o => { const s = (o.sources || [])[0] || ''; return /^https?:\/\//.test(s) ? esc(s) : '#'; };
  const ship = o => o.shipping ? `+${money(o, o.shipping)} shipping` : 'Free shipping';
  const [b, ...rest] = list;
  box.innerHTML = `<div class="tag">
      <h3>${esc(b.title)}</h3>
      <div class="big">${money(b, b.total)}</div>
      <div class="meta"><span>Best deal at ${esc(b.merchant)}</span><span>${money(b, b.price)} ${ship(b)}</span><span>★ ${b.rating}</span><span>Score ${b.score}</span></div>
      <a href="${href(b)}" target="_blank" rel="noopener noreferrer">Open offer</a></div>` +
    rest.map(o => `<a class="offer" href="${href(o)}" target="_blank" rel="noopener noreferrer">
      <b>${esc(o.title)}</b><span class="tot">${money(o, o.total)}</span>
      <span class="sub"><span>${esc(o.merchant)}</span><span>★ ${o.rating}</span><span>Score ${o.score}</span></span>
      <span class="sub r">${ship(o)}</span></a>`).join('');
}

async function send() {
  const text = $('#msg').value.trim();
  if (st.busy || (!text && !st.links.length)) return;
  addMsg('user', text || st.links.join('\n'));
  $('#msg').value = '';
  st.busy = true; $('#go').disabled = true;
  const wait = addMsg('bot pending', 'Comparing offers…');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 90000);
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, signal: ctrl.signal,
      body: JSON.stringify({session_id: st.sid, message: text || 'Please analyze these product links and find the best deal.', links: st.links, filters: st.filters})
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `Request failed (${r.status})`);
    st.filters = d.filters || {}; st.offers = d.offers || []; st.links = []; st.searched = true;
    wait.remove(); addMsg('bot', d.assistant_reply);
  } catch (e) {
    wait.remove();
    addMsg('err', e.name === 'AbortError' ? 'The server took too long to answer. Try again in a moment.' : e.message);
  } finally {
    clearTimeout(timer); st.busy = false; $('#go').disabled = false; render();
  }
}

$('#form').addEventListener('submit', e => { e.preventDefault(); send(); });
$('#msg').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('#sort').addEventListener('change', render);
$('#addLinks').addEventListener('click', () => {
  const urls = ($('#links').value.match(/https?:\/\/[^\s]+/g) || []).map(clean);
  st.links = [...new Set([...st.links, ...urls])].slice(0, 5);
  $('#links').value = ''; render();
});
$('#chips').addEventListener('click', e => { const k = e.target.dataset.k; if (k) { delete st.filters[k]; render(); } });
$('#linklist').addEventListener('click', e => { const i = e.target.dataset.i; if (i !== undefined) { st.links.splice(+i, 1); render(); } });

addMsg('bot', 'What are you shopping for? For example: **best wireless mouse under $100**. You can also add product links and I will compare them.');
render();
</script>
</body>
</html>
