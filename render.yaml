services:
  - type: web
    name: deal-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker: sessions live in memory, so all requests must hit one process
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GEMINI_API_KEY
        sync: false
